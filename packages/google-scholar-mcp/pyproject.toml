[project]
name = "google-scholar-mcp"
version = "1.0.0"
description = "MCP server for Google Scholar search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "cmm-data>=0.1.0",
]

[tool.uv.sources]
cmm-data = { workspace = true }

[project.scripts]
google-scholar-mcp = "google_scholar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_scholar_mcp"]
