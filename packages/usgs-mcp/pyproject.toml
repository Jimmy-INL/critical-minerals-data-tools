[project]
name = "usgs-mcp"
version = "0.1.0"
description = "MCP server and REST API for USGS Mineral Commodity Summaries (MCS) data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
usgs-mcp = "usgs_mcp.server:main"
usgs-api = "usgs_mcp.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usgs_mcp"]
