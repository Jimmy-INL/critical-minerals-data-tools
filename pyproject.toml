[project]
name = "critical-minerals-workspace"
version = "0.1.0"
description = "Unified workspace for critical minerals MCP servers and data tools"
requires-python = ">=3.10"
dependencies = [
    "nbclassic>=1.3.3",
    "notebook>=7.5.5",
    "plotly>=6.6.0",
]

# ── uv workspace ──────────────────────────────────────────────
[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/cmm-data/Exp_Design/fine_tuning"]

[tool.uv.sources]
arxiv-mcp = { workspace = true }
bgs-mcp = { workspace = true }
claimm-mcp = { workspace = true }
cmm-api = { workspace = true }
cmm-data = { workspace = true }
google-scholar-mcp = { workspace = true }
osti-mcp = { workspace = true }
uncomtrade-mcp = { workspace = true }
usgs-mcp = { workspace = true }
unified-data-api = { workspace = true }

# ── Shared dev dependencies ───────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    # All workspace members for unified import access
    "arxiv-mcp",
    "bgs-mcp",
    "claimm-mcp",
    "cmm-api",
    "cmm-data",
    "google-scholar-mcp",
    "osti-mcp",
    "uncomtrade-mcp",
    "usgs-mcp",
    "unified-data-api",
    # ── Notebook dependencies ────────────────────────────────
    # Core (all notebooks)
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "kaleido>=0.2.0",
    "matplotlib>=3.7.0",
    # Network / graph analysis (02, 08)
    "networkx>=3.0",
    # ML / classical (03, 04, 07)
    "scikit-learn>=1.3.0",
    "statsforecast>=1.7.0",
    "datasetsforecast>=0.0.8",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.0",
    # Embeddings (04, 06)
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    # Deep learning / FMs (03_FM, 07_FM, 09, 10)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.45.0,<4.50.0",
    "open-clip-torch>=2.20.0",
    "Pillow>=9.0.0",
    # Time-series FMs (03_FM)
    "chronos-forecasting>=1.0.0",
    "gluonts>=0.14.0",
    "lag-llama @ git+https://github.com/time-series-foundation-models/lag-llama.git",
    # LLM RAG (06_FM)
    "openai>=1.0.0",
]

# ── Ruff (shared across all workspace members) ───────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E402",
    "E501",
    "PLC0415",
    "ERA001",
    "PTH123",
    "RUF012",
    "B904",
    "B007",
    "PLW0603",
    "ARG001",
    "ARG002",
    "PLR0911",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]
"**/test_*" = ["PLC0415"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "cmm_data",
    "arxiv_mcp",
    "bgs_mcp",
    "claimm_mcp",
    "cmm_api",
    "google_scholar_mcp",
    "osti_mcp",
    "uncomtrade_mcp",
    "usgs_mcp",
    "unified_data_api",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── MyPy (shared across all workspace members) ───────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
